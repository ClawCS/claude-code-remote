# /etc/ssh/sshd_config.d/00-jammers-hardening.conf
# OpenSSH uses the first obtained value. Verify the effective full config,
# including cloud-init and Match blocks, before reloading; keep an open session.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin prohibit-password
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
LogLevel INFO
# Do not replace authorized_keys or add an unverified AllowUsers restriction.

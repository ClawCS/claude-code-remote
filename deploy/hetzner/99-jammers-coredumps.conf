# /etc/sysctl.d/99-jammers-coredumps.conf
# A piped core handler can bypass RLIMIT_CORE. Disable Apport first, then load
# this file and verify the effective values after service restart and reboot.
# The two website services additionally require LimitCORE=0 (soft and hard).
kernel.core_pattern = core
fs.suid_dumpable = 0

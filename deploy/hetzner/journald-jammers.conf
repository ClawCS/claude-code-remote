# /etc/systemd/journald.conf.d/zz-jammers.conf
# Sort after the distro's /usr/lib/systemd/journald.conf.d/syslog.conf.
[Journal]
Storage=volatile
Compress=yes
RuntimeMaxUse=128M
RuntimeMaxFileSize=16M
# A buffer below the disclosed seven-day ceiling for file-based rotation.
MaxRetentionSec=6day
MaxFileSec=1h
ForwardToSyslog=no
